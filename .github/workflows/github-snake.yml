name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate pink/purple snake SVGs from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#db2777&color_dots=#f3e8ff,#f9a8d4,#f472b6,#d946ef,#9333ea
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4fd8&color_dots=#1b1030,#4c1d6e,#7e22ce,#c026d3,#ff4fd8

      - name: Push the SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update snake animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
